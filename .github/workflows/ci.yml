name: CI

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

env:
  GO_VERSION: '1.24'
  APP_NAME: 'universal-ai-bot'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/english

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webapp/package-lock.json

    - name: Install webapp dependencies
      working-directory: ./webapp
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Run webapp type check
      working-directory: ./webapp
      run: npm run type-check

    - name: Build webapp
      working-directory: ./webapp
      run: npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      env:
        TESTCONTAINERS_RYUK_DISABLED: "true"
      run: |
        set -o pipefail
        go test -tags=test -count=1 -p 3 -timeout 30m -coverprofile=coverage.out -covermode=atomic -json $(go list ./... | grep -v '/cmd/' | grep -v 'internal/integration/' | grep -v 'internal/testutil') 2>&1 | python3 scripts/go-test-compact.py

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.10.1
        args: --timeout=3m

  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run integration tests (Testcontainers)
      env:
        TESTCONTAINERS_RYUK_DISABLED: "true"
      run: |
        set -o pipefail
        go test -tags=integration -json -count=1 ./internal/integration/testkit/... ./internal/integration/user_flows/... -timeout 600s 2>&1 | python3 scripts/go-test-compact.py

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test, test-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webapp/package-lock.json

    - name: Install webapp dependencies
      working-directory: ./webapp
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Build webapp
      working-directory: ./webapp
      run: npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Build all binaries
      run: |
        mkdir -p dist
        # Linux amd64
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-linux_amd64 ./cmd/bot
        # Linux arm64
        # GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-linux_arm64 ./cmd/bot
        # Windows amd64
        # GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-windows_amd64.exe ./cmd/bot
        # macOS amd64
        # GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-darwin_amd64 ./cmd/bot
        # macOS arm64
        # GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-darwin_arm64 ./cmd/bot
        chmod +x dist/universal-ai-bot-*
        ls -la dist/

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        body: |
          ## Telegram Bot Skeleton ${{ github.ref_name }}
          
          ### Downloads
          - `universal-ai-bot-linux_amd64` - Linux x86_64
          # - `universal-ai-bot-linux_arm64` - Linux ARM64
          # - `universal-ai-bot-windows_amd64.exe` - Windows x86_64
          # - `universal-ai-bot-darwin_amd64` - macOS x86_64
          # - `universal-ai-bot-darwin_arm64` - macOS ARM64
          
          ### Installation
          1. Download the binary
          2. Make it executable: `chmod +x universal-ai-bot-linux_amd64`
          3. Create `.env` file with your configuration
          4. Run: `./universal-ai-bot-linux_amd64`
          
          ### Checksums
          ```
          $(cat dist/checksums.txt)
          ```
        draft: false
        prerelease: false

  docker-image:
    name: Build Docker Image (${{ matrix.image_suffix }})
    runs-on: ubuntu-latest
    needs: [test, test-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        image_suffix: [english, spanish]
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_suffix }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Install webapp dependencies
      working-directory: ./webapp
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Build embedded webapp
      working-directory: ./webapp
      run: npm run build

    - name: Decode Android keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is required" && exit 1)
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

    - name: Ensure GitHub release exists
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Temporary APK CI debug release. The normal release job may update assets later." || \
            gh release view "${{ github.ref_name }}" >/dev/null
        fi

    - name: Build embedded APKs
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        test -n "${BUBBLEWRAP_KEYSTORE_PASSWORD}" || (echo "ANDROID_KEYSTORE_PASSWORD is required" && exit 1)
        test -n "${BUBBLEWRAP_KEY_PASSWORD}" || (echo "ANDROID_KEY_PASSWORD is required" && exit 1)
        test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "ANDROID_KEY_ALIAS is required" && exit 1)
        ./scripts/build-embedded-apks.sh \
          "${{ github.ref_name }}" \
          "$PWD/release.keystore" \
          "${{ secrets.ANDROID_KEY_ALIAS }}"

    - name: Update release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd dist
        gh release download "${{ github.ref_name }}" -p checksums.txt || true
        sha256sum qantrix-english-${{ github.ref_name }}.apk qantrix-spanish-${{ github.ref_name }}.apk >> checksums.txt
        sort -u checksums.txt -o checksums.txt
        gh release upload "${{ github.ref_name }}" \
          qantrix-english-${{ github.ref_name }}.apk \
          qantrix-spanish-${{ github.ref_name }}.apk \
          checksums.txt \
          --clobber
