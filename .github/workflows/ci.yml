name: CI

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

env:
  GO_VERSION: '1.24'
  APP_NAME: 'universal-ai-bot'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/english

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webapp/package-lock.json

    - name: Install webapp dependencies
      working-directory: ./webapp
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Run webapp type check
      working-directory: ./webapp
      run: npm run type-check

    - name: Build webapp
      working-directory: ./webapp
      run: npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -tags=test -count=1 -p 3 -timeout 30m -coverprofile=coverage.out -covermode=atomic -v $(go list ./... | grep -v '/cmd/' | grep -v 'internal/integration/' | grep -v 'internal/testutil')

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.10.1
        args: --timeout=3m

  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run integration tests (Testcontainers)
      run: go test -tags=integration -v -count=1 ./internal/integration/testkit/... ./internal/integration/user_flows/... -timeout 600s

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [test, test-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: webapp/package-lock.json

    - name: Install webapp dependencies
      working-directory: ./webapp
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Build webapp
      working-directory: ./webapp
      run: npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Build all binaries
      run: |
        mkdir -p dist
        # Linux amd64
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-linux_amd64 ./cmd/bot
        # Linux arm64
        # GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-linux_arm64 ./cmd/bot
        # Windows amd64
        # GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-windows_amd64.exe ./cmd/bot
        # macOS amd64
        # GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-darwin_amd64 ./cmd/bot
        # macOS arm64
        # GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-darwin_arm64 ./cmd/bot
        chmod +x dist/universal-ai-bot-*
        ls -la dist/

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        body: |
          ## Telegram Bot Skeleton ${{ github.ref_name }}
          
          ### Downloads
          - `universal-ai-bot-linux_amd64` - Linux x86_64
          # - `universal-ai-bot-linux_arm64` - Linux ARM64
          # - `universal-ai-bot-windows_amd64.exe` - Windows x86_64
          # - `universal-ai-bot-darwin_amd64` - macOS x86_64
          # - `universal-ai-bot-darwin_arm64` - macOS ARM64
          
          ### Installation
          1. Download the binary
          2. Make it executable: `chmod +x universal-ai-bot-linux_amd64`
          3. Create `.env` file with your configuration
          4. Run: `./universal-ai-bot-linux_amd64`
          
          ### Checksums
          ```
          $(cat dist/checksums.txt)
          ```
        draft: false
        prerelease: false

  docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, test-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
