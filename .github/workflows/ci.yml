name: CI

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

env:
  GO_VERSION: '1.24'
  APP_NAME: 'universal-ai-bot'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install webapp dependencies
      working-directory: ./webapp
      run: npm install

    - name: Run webapp type check
      working-directory: ./webapp
      run: npm run type-check

    - name: Build webapp
      working-directory: ./webapp
      run: npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -tags=test -v ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.1.0
        args: --timeout=3m

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install webapp dependencies
      working-directory: ./webapp
      run: npm install

    - name: Build webapp
      working-directory: ./webapp
      run: npm run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Build all binaries
      run: |
        mkdir -p dist
        # Linux amd64
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-linux_amd64 ./cmd/bot
        # Linux arm64
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-linux_arm64 ./cmd/bot
        # Windows amd64
        GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-windows_amd64.exe ./cmd/bot
        # macOS amd64
        GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-darwin_amd64 ./cmd/bot
        # macOS arm64
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/universal-ai-bot-darwin_arm64 ./cmd/bot
        chmod +x dist/universal-ai-bot-*
        ls -la dist/

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        body: |
          ## Telegram Bot Skeleton ${{ github.ref_name }}
          
          ### Downloads
          - `universal-ai-bot-linux_amd64` - Linux x86_64
          - `universal-ai-bot-linux_arm64` - Linux ARM64
          - `universal-ai-bot-windows_amd64.exe` - Windows x86_64
          - `universal-ai-bot-darwin_amd64` - macOS x86_64
          - `universal-ai-bot-darwin_arm64` - macOS ARM64
          
          ### Installation
          1. Download the appropriate binary for your system
          2. Make it executable: `chmod +x universal-ai-bot-linux_amd64`
          3. Create `.env` file with your configuration
          4. Run: `./universal-ai-bot-linux_amd64`
          
          ### Checksums
          ```
          $(cat dist/checksums.txt)
          ```
        draft: false
        prerelease: false

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ${{ secrets.SERVER_PATH }}
          make deploy