      description: Включает/выключает публикацию главы
      parameters:
      - description: ID главы
        in: path
        name: chapter_id
        required: true
        type: string
      - description: Данные публикации
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Результат
          schema:
            additionalProperties: true
            type: object
        "401":
