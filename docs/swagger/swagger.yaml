  /api/admin/training/{word}:
    get:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: 'Получение (GET), создание (POST), генерация через LLM (POST /generate)
        или удаление (POST /delete) тренировочных карточек по слову. Путь: /api/admin/training/{word}
