      parameters:
      - description: ID категории
        in: path
        name: section_id
        required: true
        type: string
      - description: Данные публикации
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Результат
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Установить статус публикации категории
      tags:
      - Admin
  /api/admin/grammar/chapters:
    get:
      consumes:
      - application/json
      description: Возвращает список глав категории с информацией о публикации
      parameters:
      - description: ID категории
        in: query
        name: section_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список глав
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
