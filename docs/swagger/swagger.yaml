basePath: /
definitions:
  internal_web.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  internal_web.placementAnswerDocumentation:
    properties:
      answer:
        description: A choice ID, or the empty string for an explicit "I don't know".
          Missing/null is invalid.
        example: a
        type: string
      question_id:
        example: es.placement.a1.location.01
        type: string
    required:
    - answer
    - question_id
    type: object
  internal_web.placementErrorDocumentation:
    properties:
      code:
        example: placement_expired
        type: string
      message:
        example: Срок этой попытки истёк. Начните новый тест.
        type: string
    type: object
  internal_web.placementHistoryDocumentation:
    properties:
      sessions:
        description: |-
          The latest ten completed attempts for this course. Questions and answers are null;
          the diagnostic profile, answer review and published recommendations are in result.
        items:
          $ref: '#/definitions/internal_web.placementSessionDocumentation'
        type: array
    type: object
  internal_web.placementRetiredDocumentation:
    properties:
      code:
        example: placement_replaced
        type: string
      message:
        example: Откройте новый тест определения уровня.
        type: string
      path:
        example: /learning/placement-test
        type: string
    type: object
  internal_web.placementSessionDocumentation:
    properties:
      answers:
        additionalProperties:
          type: string
        type: object
      available_chapter_ids:
        description: |-
          Present only for a completed attempt with usable result links. This is a
          selected subset of currently accessible chapter IDs from result recommendations
          and review, not the complete course catalog. Link only to chapter IDs present
          here; a recommended topic may remain visible even when all its lessons are
          locked by the course sequence. Omitted when no accessible result links exist.
        items:
          type: string
        type: array
      bank_version:
        type: string
      base_closed:
        type: boolean
      clarifying:
        type: boolean
      course_code:
        type: string
      id:
        type: string
      policy_version:
        type: string
      questions:
        items:
          $ref: '#/definitions/tgbot-skeleton_internal_placement.Question'
        type: array
      result:
        $ref: '#/definitions/tgbot-skeleton_internal_placement.Result'
      status:
        type: string
    type: object
  internal_web.placementStartDocumentation:
    properties:
      course_code:
        description: Defaults to the requested or currently selected course when omitted.
        enum:
        - en_ru
        - es_ru
        example: es_ru
        type: string
      idempotency_key:
        description: Reuse the same key when retrying the same start/resume request.
        example: d83b3477-1a78-414e-92c4-f1287a5c58d5
        maxLength: 100
        minLength: 8
        type: string
      new_attempt:
        default: false
        description: True abandons an active attempt and creates another selection.
        type: boolean
    required:
    - idempotency_key
    type: object
  tgbot-skeleton_internal_placement.Choice:
    properties:
      id:
        type: string
      text:
        type: string
    type: object
  tgbot-skeleton_internal_placement.LevelScore:
    properties:
      correct:
        type: integer
      level:
        type: string
      status:
        description: secure, borderline, limited
        type: string
      total:
        type: integer
    type: object
  tgbot-skeleton_internal_placement.Question:
    properties:
      choices:
        items:
          $ref: '#/definitions/tgbot-skeleton_internal_placement.Choice'
        type: array
      context:
        type: string
      id:
        type: string
      instruction:
        type: string
      prompt:
        type: string
    type: object
  tgbot-skeleton_internal_placement.Result:
    properties:
      correct:
        type: integer
      estimated:
        type: boolean
      level:
        type: string
      opened_sections:
        items:
          type: string
        type: array
      policy_version:
        type: string
      profile:
        items:
          $ref: '#/definitions/tgbot-skeleton_internal_placement.LevelScore'
        type: array
      recommended_skills:
        items:
          $ref: '#/definitions/tgbot-skeleton_internal_placement.Skill'
        type: array
      review:
        items:
          $ref: '#/definitions/tgbot-skeleton_internal_placement.Review'
        type: array
      total:
        type: integer
      upper_level:
        type: string
    type: object
  tgbot-skeleton_internal_placement.Review:
    properties:
      answer:
        type: string
      chapter_ids:
        items:
          type: string
        type: array
      choices:
        items:
          $ref: '#/definitions/tgbot-skeleton_internal_placement.Choice'
        type: array
      context:
        type: string
      correct:
        type: boolean
      correct_answer:
        type: string
      explanation:
        type: string
      id:
        type: string
      instruction:
        type: string
      level:
        type: string
      prompt:
        type: string
      revision:
        type: integer
      skill_id:
        type: string
      skill_title:
        type: string
    type: object
  tgbot-skeleton_internal_placement.Skill:
    properties:
      chapter_ids:
        items:
          type: string
        type: array
      description:
        type: string
      id:
        type: string
      level:
        type: string
      section_id:
        type: string
      title:
        type: string
    type: object
host: localhost:8184
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API для English Bot - системы изучения английского языка с использованием
    SRS (Spaced Repetition System)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: English Bot API
  version: "1.0"
paths:
  /api/access/me:
    get:
      consumes:
      - application/json
      description: Возвращает список категорий пользователя и эффективные права доступа
        (вычисленные из категорий)
      produces:
      - application/json
      responses:
        "200":
          description: Категории и права пользователя
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить мои права доступа
      tags:
      - Access
  /api/admin:
    get:
      consumes:
      - application/json
      description: Возвращает состояние circuit breaker и информацию об администраторе
        (только для администраторов)
      produces:
      - application/json
      responses:
        "200":
          description: Данные админ-панели
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен (требуются права администратора)
          schema:
            type: string
        "405":
          description: Метод не разрешен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить данные админ-панели
      tags:
      - Admin
  /api/admin/app-settings:
    get:
      consumes:
      - application/json
      description: Возвращает или обновляет настройки приложения (только для администраторов)
      parameters:
      - description: Настройки приложения (для PUT)
        in: body
        name: settings
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Настройки приложения или результат обновления
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос
          schema:
            type: string
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить/Обновить настройки приложения
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Возвращает или обновляет настройки приложения (только для администраторов)
      parameters:
      - description: Настройки приложения (для PUT)
        in: body
        name: settings
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Настройки приложения или результат обновления
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос
          schema:
            type: string
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить/Обновить настройки приложения
      tags:
      - Admin
  /api/admin/circuit/reset:
    post:
      consumes:
      - application/json
      description: Сбрасывает состояние circuit breaker (только для администраторов)
      produces:
      - application/json
      responses:
        "200":
          description: Успешный сброс
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен (требуются права администратора)
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Сбросить circuit breaker
      tags:
      - Admin
  /api/admin/conversations/import:
    post:
      responses: {}
      summary: 'Admin: импорт сценария общения из JSON'
      tags:
      - Admin
  /api/admin/conversations/prompt-template:
    get:
      responses: {}
      summary: 'Admin: промпт для генерации сценария общения'
      tags:
      - Admin
  /api/admin/conversations/scenarios:
    get:
      responses: {}
      summary: 'Admin: список/создание сценариев общения'
      tags:
      - Admin
  /api/admin/grammar/categories:
    get:
      consumes:
      - application/json
      description: Возвращает полный список категорий с информацией о публикации
      produces:
      - application/json
      responses:
        "200":
          description: Список категорий
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить все категории грамматики (админ)
      tags:
      - Admin
  /api/admin/grammar/categories/{section_id}/publish:
    post:
      consumes:
      - application/json
      description: Включает/выключает публикацию категории, опционально каскадно для
        глав
      parameters:
      - description: ID категории
        in: path
        name: section_id
        required: true
        type: string
      - description: Данные публикации
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Результат
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Установить статус публикации категории
      tags:
      - Admin
  /api/admin/grammar/chapters:
    get:
      consumes:
      - application/json
      description: Возвращает список глав категории с информацией о публикации
      parameters:
      - description: ID категории
        in: query
        name: section_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список глав
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить главы категории (админ)
      tags:
      - Admin
  /api/admin/grammar/chapters/{chapter_id}/publish:
    post:
      consumes:
      - application/json
      description: Включает/выключает публикацию главы
      parameters:
      - description: ID главы
        in: path
        name: chapter_id
        required: true
        type: string
      - description: Данные публикации
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Результат
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Установить статус публикации главы
      tags:
      - Admin
  /api/admin/grammar/items/{item_type}/{item_id}/rename:
    post:
      consumes:
      - application/json
      description: Устанавливает кастомное имя для категории или главы
      parameters:
      - description: Тип элемента (section/chapter)
        in: path
        name: item_type
        required: true
        type: string
      - description: ID элемента
        in: path
        name: item_id
        required: true
        type: string
      - description: Данные переименования
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Результат
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Переименовать категорию/главу
      tags:
      - Admin
  /api/admin/lumi-facts:
    get:
      responses: {}
      summary: Управление Lumi-фактами
      tags:
      - Admin
  /api/admin/lumi-facts/prompt-template:
    get:
      responses: {}
      summary: 'Admin: промпт для генерации Lumi-фактов'
      tags:
      - Admin
  /api/admin/orphaned-cards:
    get:
      consumes:
      - application/json
      description: Возвращает список training_cards, которые ссылаются на несуществующие
        word_cards
      parameters:
      - default: 50
        description: Лимит записей
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список подвешенных карточек
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить список подвешенных тренировочных карточек
      tags:
      - Admin
  /api/admin/orphaned-cards/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет training_card по ID (каскадно удаляет связанные user_cards
        и review_events)
      parameters:
      - description: ID тренировочной карточки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное удаление
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "404":
          description: Карточка не найдена
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Удалить подвешенную тренировочную карточку
      tags:
      - Admin
  /api/admin/orphaned-user-cards:
    get:
      consumes:
      - application/json
      description: Возвращает список user_cards, которые ссылаются на несуществующие
        training_cards
      parameters:
      - description: Лимит записей (по умолчанию 50)
        in: query
        name: limit
        type: integer
      - description: Смещение для пагинации (по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список подвешенных user карточек
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить список подвешенных user карточек
      tags:
      - Admin
  /api/admin/orphaned-user-cards/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет user_card по ID (каскадно удаляет связанные review_events)
      parameters:
      - description: ID user карточки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное удаление
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "404":
          description: Карточка не найдена
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Удалить подвешенную user карточку
      tags:
      - Admin
  /api/admin/picture-quests:
    get:
      responses: {}
      summary: 'Admin: список/создание квестов «опиши картинку»'
      tags:
      - Admin
  /api/admin/picture-quests/import:
    post:
      responses: {}
      summary: 'Admin: импорт квеста «опиши картинку» из JSON'
      tags:
      - Admin
  /api/admin/picture-quests/prompt-template:
    get:
      responses: {}
      summary: 'Admin: промпт для генерации квеста «опиши картинку»'
      tags:
      - Admin
  /api/admin/stats:
    get:
      consumes:
      - application/json
      description: Возвращает метрики по пользователям, активности, тренировкам и
        карточкам
      parameters:
      - description: Количество дней для daily timeseries (по умолчанию 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Статистика системы
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "405":
          description: Метод не разрешен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить статистику системы
      tags:
      - Admin
  /api/admin/training/{word}:
    get:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: 'Получение (GET), создание (POST), генерация через LLM (POST /generate)
        или удаление (POST /delete) тренировочных карточек по слову. Путь: /api/admin/training/{word}
        или /api/admin/training/{word}/generate или /api/admin/training/{word}/delete
        или /api/admin/training/delete_all'
      parameters:
      - description: Английское слово
        in: path
        name: word
        type: string
      - description: 'Ограничения для генерации (для POST /generate, JSON: {\'
        in: body
        name: constraints
        schema:
          type: string
      - description: Русский перевод слова (для POST)
        in: formData
        name: word_ru
        type: string
      - description: Значение на изучаемом языке (target) (для POST)
        in: formData
        name: meaning_en
        type: string
      - description: Пример на изучаемом языке (target) (для POST)
        in: formData
        name: example_en
        type: string
      - description: Пример на русском (для POST)
        in: formData
        name: example_ru
        type: string
      - description: Транскрипция (для POST)
        in: formData
        name: transcription
        type: string
      - description: Отвлекающие варианты (RU, JSON array) (для POST)
        in: formData
        name: distractors_ru
        type: string
      - description: Отвлекающие варианты на изучаемом языке (target, JSON array)
          (для POST)
        in: formData
        name: distractors_en
        type: string
      - description: Подсказка (для POST)
        in: formData
        name: hint
        type: string
      - description: Часть речи (для POST)
        in: formData
        name: pos
        type: string
      - description: Отображаемое слово (для POST)
        in: formData
        name: display_word
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Данные карточек или результат создания/удаления/генерации
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос
          schema:
            type: string
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен (требуются права администратора)
          schema:
            type: string
        "404":
          description: Слово не найдено (для POST)
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
