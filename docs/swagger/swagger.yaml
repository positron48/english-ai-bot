  /api/admin/grammar/items/{item_type}/{item_id}/rename:
    post:
      consumes:
      - application/json
      description: Устанавливает кастомное имя для категории или главы
      parameters:
      - description: Тип элемента (section/chapter)
        in: path
        name: item_type
        required: true
        type: string
      - description: ID элемента
        in: path
        name: item_id
        required: true
        type: string
      - description: Данные переименования
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Результат
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Переименовать категорию/главу
