basePath: /
definitions:
  internal_web.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  tgbot-skeleton_internal_service.PlacementTestResult:
    properties:
      correct:
        type: integer
      level:
        description: CEFR level of last opened section, or "Below A1" / "—"
        type: string
      opened_sections:
        items:
          type: string
        type: array
      results:
        description: 'per-question: question_id, correct, user_answer, correct_answer,
          explanation, placement_chapter_title'
        items: {}
        type: array
      score:
        type: integer
      total_questions:
        type: integer
    type: object
  tgbot-skeleton_internal_service.TestQuestions:
    properties:
      questions:
        items: {}
        type: array
      total:
        type: integer
    type: object
host: localhost:8184
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API для English Bot - системы изучения английского языка с использованием
    SRS (Spaced Repetition System)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: English Bot API
  version: "1.0"
paths:
  /api/access/me:
    get:
      consumes:
      - application/json
      description: Возвращает список категорий пользователя и эффективные права доступа
        (вычисленные из категорий)
      produces:
      - application/json
      responses:
        "200":
          description: Категории и права пользователя
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить мои права доступа
      tags:
      - Access
  /api/admin:
    get:
      consumes:
      - application/json
      description: Возвращает состояние circuit breaker и информацию об администраторе
        (только для администраторов)
      produces:
      - application/json
      responses:
        "200":
          description: Данные админ-панели
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен (требуются права администратора)
          schema:
            type: string
        "405":
          description: Метод не разрешен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить данные админ-панели
      tags:
      - Admin
  /api/admin/app-settings:
    get:
      consumes:
      - application/json
      description: Возвращает или обновляет настройки приложения (только для администраторов)
      parameters:
      - description: Настройки приложения (для PUT)
        in: body
        name: settings
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Настройки приложения или результат обновления
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос
          schema:
            type: string
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить/Обновить настройки приложения
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Возвращает или обновляет настройки приложения (только для администраторов)
      parameters:
      - description: Настройки приложения (для PUT)
        in: body
        name: settings
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Настройки приложения или результат обновления
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос
          schema:
            type: string
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить/Обновить настройки приложения
      tags:
      - Admin
  /api/admin/circuit/reset:
    post:
      consumes:
      - application/json
      description: Сбрасывает состояние circuit breaker (только для администраторов)
      produces:
      - application/json
      responses:
        "200":
          description: Успешный сброс
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен (требуются права администратора)
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Сбросить circuit breaker
      tags:
      - Admin
  /api/admin/conversations/scenarios:
    get:
      responses: {}
      summary: 'Admin: список/создание сценариев общения'
      tags:
      - Admin
  /api/admin/grammar/categories:
    get:
      consumes:
      - application/json
      description: Возвращает полный список категорий с информацией о публикации
      produces:
      - application/json
      responses:
        "200":
          description: Список категорий
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить все категории грамматики (админ)
      tags:
      - Admin
  /api/admin/grammar/categories/{section_id}/publish:
    post:
      consumes:
      - application/json
      description: Включает/выключает публикацию категории, опционально каскадно для
