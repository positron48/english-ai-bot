      - ApiKeyAuth: []
      summary: Управление тренировочными карточками
      tags:
      - Admin
    post:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: 'Получение (GET), создание (POST), генерация через LLM (POST /generate)
