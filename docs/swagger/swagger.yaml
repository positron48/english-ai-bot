        или /api/admin/training/{word}/generate или /api/admin/training/{word}/delete
        или /api/admin/training/delete_all'
      parameters:
      - description: Английское слово
        in: path
        name: word
        type: string
      - description: 'Ограничения для генерации (для POST /generate, JSON: {\'
        in: body
        name: constraints
        schema:
          type: string
      - description: Русский перевод слова (для POST)
        in: formData
        name: word_ru
        type: string
      - description: Значение на изучаемом языке (target) (для POST)
        in: formData
        name: meaning_en
        type: string
      - description: Пример на изучаемом языке (target) (для POST)
        in: formData
        name: example_en
        type: string
      - description: Пример на русском (для POST)
        in: formData
        name: example_ru
        type: string
      - description: Транскрипция (для POST)
        in: formData
        name: transcription
        type: string
      - description: Отвлекающие варианты (RU, JSON array) (для POST)
        in: formData
        name: distractors_ru
        type: string
      - description: Отвлекающие варианты на изучаемом языке (target, JSON array)
