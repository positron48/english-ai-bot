      - description: Подсказка (для POST)
        in: formData
        name: hint
        type: string
      - description: Часть речи (для POST)
        in: formData
        name: pos
        type: string
      - description: Отображаемое слово (для POST)
        in: formData
        name: display_word
        type: string
      produces:
      - application/json
      responses:
