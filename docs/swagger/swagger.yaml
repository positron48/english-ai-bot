        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное удаление
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "403":
          description: Доступ запрещен
          schema:
            type: string
        "404":
          description: Карточка не найдена
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Удалить подвешенную user карточку
