  /api/learning/placement/results:
    get:
      description: 'Возвращает до десяти последних завершённых попыток текущего пользователя
        только для выбранного курса, от новых к старым. В элементах sessions поля
        questions и answers равны null; результат и разбор находятся в result. Снятые
        с публикации главы/разделы исключены из chapter_ids. Необязательный available_chapter_ids
        содержит выбранные доступные переходы из результата, а не все доступные уроки
        курса; темы, закрытые последовательностью, остаются видимыми без ссылки. Cache-Control:
        no-store.'
      parameters:
      - description: Курс; при отсутствии используется текущий выбранный курс
        enum:
        - en_ru
        - es_ru
        in: query
        name: course_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web.placementHistoryDocumentation'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "404":
          description: placement_course_not_found
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "503":
          description: placement_unavailable
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
      security:
      - ApiKeyAuth: []
      summary: Получить историю диагностики языка
      tags:
      - Learning Placement
  /api/learning/placement/sessions:
    post:
      consumes:
      - application/json
      description: 'Создаёт самостоятельный тест из 30 вопросов A1–C1 либо восстанавливает
        активную попытку пользователя в указанном курсе. Повтор одного idempotency_key
        возвращает ту же попытку; для пересдачи отправьте новый ключ и new_attempt=true.
        Вопросы и резерв до шести уточнений закреплены в сессии. Правильные ответы
        и объяснения отсутствуют до завершения. Все ответы имеют Cache-Control: no-store.'
      parameters:
      - description: Курс, если course_code отсутствует в теле; иначе используется
          текущий курс
        enum:
        - en_ru
        - es_ru
        in: query
        name: course_code
        type: string
      - description: Курс и ключ идемпотентности
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_web.placementStartDocumentation'
      produces:
      - application/json
      responses:
        "200":
          description: Новая или восстановленная попытка; available_chapter_ids только
            для завершённой попытки с доступными переходами из результата
          schema:
            $ref: '#/definitions/internal_web.placementSessionDocumentation'
        "400":
          description: placement_invalid_request / placement_invalid_answer
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "404":
          description: placement_course_not_found / placement_not_found
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "410":
          description: 'placement_expired: попытка завершена отказом, истекла или
            её политика больше не поддерживается'
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "503":
          description: placement_unavailable
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
      security:
      - ApiKeyAuth: []
      summary: Начать или восстановить диагностику языка
      tags:
      - Learning Placement
  /api/learning/placement/sessions/{session_id}:
    get:
      description: 'Возвращает закреплённые публичные вопросы и сохранённые ответы
        пользователя. Курс определяется сессией, а доступ — её владельцем. После завершения
        содержит result с профилем уровней, разбором и опубликованными рекомендациями.
        available_chapter_ids перечисляет выбранные доступные переходы из результата,
        а не весь каталог; ссылка на урок допустима только для ID из этого списка.
        Закрытая последовательностью тема остаётся видимой без ссылки. При отсутствии
        доступных переходов поле опущено. Не создаёт новую попытку. Cache-Control:
        no-store.'
      parameters:
      - description: 'Идентификатор сессии: 32 шестнадцатеричных символа'
        in: path
        maxLength: 32
        minLength: 32
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web.placementSessionDocumentation'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "404":
          description: 'placement_not_found: не найдена либо принадлежит другому пользователю'
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "410":
          description: placement_expired
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "503":
          description: placement_unavailable
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
      security:
      - ApiKeyAuth: []
      summary: Получить сохранённую попытку диагностики
      tags:
      - Learning Placement
  /api/learning/placement/sessions/{session_id}/answers:
    post:
      consumes:
      - application/json
      description: 'Принимает один идентификатор варианта или пустую строку для «Не
        знаю»; отсутствующий/null answer недопустим. После 30 ответов base_closed=true
        и основной блок больше не изменяется. При необходимости сервер добавляет ровно
        шесть уточнений: clarifying=true, questions содержит 36 вопросов. Повтор того
        же сохранённого ответа безопасен; ключи ответов и объяснения до finish не
        раскрываются. Cache-Control: no-store.'
      parameters:
      - description: Идентификатор сессии
        in: path
        maxLength: 32
        minLength: 32
        name: session_id
        required: true
        type: string
      - description: Один ответ на выданный вопрос
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_web.placementAnswerDocumentation'
      produces:
      - application/json
      responses:
        "200":
          description: Состояние после сохранения, включая уточнения при закрытии
            основного блока
          schema:
            $ref: '#/definitions/internal_web.placementSessionDocumentation'
        "400":
          description: placement_invalid_request / placement_invalid_answer
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "404":
          description: placement_not_found
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "409":
          description: 'placement_conflict: попытка или основной блок закрыты для
            изменений'
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "410":
          description: placement_expired
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "503":
          description: placement_unavailable
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
      security:
      - ApiKeyAuth: []
      summary: Сохранить ответ диагностики
      tags:
      - Learning Placement
  /api/learning/placement/sessions/{session_id}/finish:
    post:
      description: 'Требует ответы на все выданные вопросы, включая уточнения, если
        они появились. Атомарно сохраняет результат и расширяет доступ только в курсе
        этой сессии. Слабая пересдача не уменьшает ранее открытый доступ; уроки не
        помечаются пройденными. Повтор finish возвращает сохранённый результат с актуальными
        доступными переходами. available_chapter_ids содержит только выбранные доступные
        уроки из рекомендаций/разбора и не является каталогом курса; при отсутствии
        доступных переходов поле опущено. Закрытые последовательностью темы остаются
        видимыми без ссылки. Оценка относится к грамматике в письменном контексте
        и остаётся ориентировочной. Тело запроса не требуется. Cache-Control: no-store.'
      parameters:
      - description: Идентификатор сессии
        in: path
        maxLength: 32
        minLength: 32
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status=completed, result с profile, review и recommended_skills;
            необязательный available_chapter_ids для доступных переходов
          schema:
            $ref: '#/definitions/internal_web.placementSessionDocumentation'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_web.placementErrorDocumentation'
        "404":
          description: placement_not_found
