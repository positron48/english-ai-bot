    get:
      consumes:
      - application/json
      description: Возвращает список всех слов пользователя с статистикой (общее количество
        карточек, количество готовых к повторению, дата последнего повторения). Поддерживает
        пагинацию и поиск.
      parameters:
      - description: Поиск по слову
        in: query
        name: search
        type: string
      - description: 'Фильтр по уровню мастерства: new, learning, mastered, known'
        in: query
        name: mastery_level
        type: string
      - description: Номер страницы (начиная с 1)
        in: query
        name: page
        type: integer
      - description: Количество элементов на странице (по умолчанию 25)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неавторизован
          schema:
            type: string
        "405":
          description: Метод не разрешен
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Прогресс по словам в разрезе уровней
      tags:
      - Vocab
      - Linglow
  /api/vocab/{word}:
    get:
      consumes:
      - application/json
      description: 'Подтверждение удаления (GET) или удаление слова (POST) из словаря
        пользователя. Путь: /api/vocab/{word}/confirm_delete или /api/vocab/{word}/delete'
      parameters:
      - description: Английское слово для удаления
        in: path
        name: word
        required: true
        type: string
      - description: 'Действие: confirm_delete или delete'
        in: path
        name: action
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Информация о слове или результат удаления
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос
          schema:
            type: string
        "401":
          description: Неавторизован
          schema:
            type: string
        "404":
          description: Слово не найдено
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Удалить слово из словаря
      tags:
      - Vocab
  /api/vocab/{word}/cards:
    get:
      consumes:
      - application/json
      description: Возвращает детальную информацию о всех карточках пользователя для
        указанного слова (лемма)
      parameters:
      - description: Лемма слова (word_cards.word)
        in: path
        name: word
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Детальная информация о карточках
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос
          schema:
            type: string
        "401":
          description: Неавторизован
          schema:
            type: string
        "404":
          description: Слово не найдено
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Получить детальную информацию о карточках слова
      tags:
      - Vocab
  /auth/otp:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Проверяет OTP код и возвращает JWT токен для пользователя при успешной
        проверке
      parameters:
      - description: ID пользователя
        in: formData
        name: user_id
        required: true
        type: string
      - description: OTP код (только цифры)
        in: formData
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешная аутентификация с JWT токеном
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос (отсутствует user_id или code)
          schema:
            type: string
        "401":
          description: Неверный или истекший OTP код
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Проверка OTP кода
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Обновляет access токен используя refresh токен. Возвращает новую
        пару access и refresh токенов. Формат запроса: `{"refresh_token": "ваш_refresh_токен"}`'
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_web.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Новая пара токенов
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос (отсутствует refresh_token)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Неверный или истекший refresh токен
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Обновление токенов
      tags:
      - Auth
  /auth/request_otp:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Генерирует и отправляет OTP код пользователю через Telegram бота.
        Пользователь должен быть найден по username или telegram_id.
      parameters:
      - description: Username или Telegram ID пользователя
        in: formData
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OTP код отправлен
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос (отсутствует username)
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Запрос OTP кода
      tags:
      - Auth
  /auth/telegram:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Аутентификация пользователя через Telegram WebApp initData. Возвращает
        пару JWT токенов (access и refresh) для авторизованного пользователя.
      parameters:
      - description: Telegram WebApp initData (подписанные данные от Telegram)
        in: formData
        name: initData
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешная аутентификация с JWT токенами
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос (отсутствует initData)
          schema:
            type: string
        "401":
          description: Неавторизован (неверный initData)
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Аутентификация через Telegram WebApp
      tags:
      - Auth
  /auth/telegram_unsafe:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Аутентификация пользователя через user_id напрямую (менее безопасный
        метод, используется как fallback). Возвращает пару JWT токенов (access и refresh)
        для авторизованного пользователя.
      parameters:
      - description: Telegram User ID
        in: formData
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешная аутентификация с JWT токенами
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный запрос (отсутствует user_id)
          schema:
            type: string
        "500":
          description: Внутренняя ошибка сервера
          schema:
            type: string
      summary: Аутентификация через Telegram WebApp (небезопасный метод)
      tags:
      - Auth
securityDefinitions:
  ApiKeyAuth:
    description: Bearer JWT token authentication. В Swagger UI введите только токен
      (без "Bearer "), префикс будет добавлен автоматически.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Методы аутентификации (Telegram WebApp и OTP)
  name: Auth
- description: Главная панель пользователя
  name: Dashboard
- description: Управление словарным запасом
  name: Vocab
- description: Система тренировок и обучения
  name: Training
- description: AI чат для помощи в изучении языка
  name: Chat
- description: Административные функции
  name: Admin
