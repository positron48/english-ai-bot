{{define "app.html"}}
{{template "base.html" .}}
{{end}}

{{define "app-content"}}
<div class="app-shell">
    <header>
        <h1>English Bot</h1>
        <nav>
            <a href="/app/dashboard">Dashboard</a>
            <a href="/app/vocab">Vocabulary</a>
            <a href="/app/training/start">Training</a>
        </nav>
    </header>
    <main id="main-content">
        <p>Loading...</p>
    </main>
</div>
<script>
    (function() {
        // Check if we're in Telegram WebApp
        if (!window.Telegram || !window.Telegram.WebApp) {
            // Not in Telegram, redirect to login
            window.location.href = '/login';
            return;
        }
        
        const tg = window.Telegram.WebApp;
        
        // Initialize WebApp
        tg.ready();
        tg.expand();
        
        let authAttempted = false;
        
        // Function to authenticate
        function authenticate() {
            if (authAttempted) {
                return; // Prevent multiple attempts
            }
            
            // Try to get initData string
            let initData = tg.initData;
            
            // If initData is not available, try to construct it from initDataUnsafe
            if (!initData || initData.length === 0) {
                if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.hash) {
                    // Construct initData string from initDataUnsafe
                    const params = [];
                    const unsafe = tg.initDataUnsafe;
                    
                    // Add query_id if available
                    if (unsafe.query_id) {
                        params.push('query_id=' + encodeURIComponent(unsafe.query_id));
                    }
                    
                    // Add user (required)
                    if (unsafe.user) {
                        params.push('user=' + encodeURIComponent(JSON.stringify(unsafe.user)));
                    }
                    
                    // Add auth_date (required)
                    if (unsafe.auth_date) {
                        params.push('auth_date=' + encodeURIComponent(String(unsafe.auth_date)));
                    }
                    
                    // Add hash (required for validation)
                    if (unsafe.hash) {
                        params.push('hash=' + encodeURIComponent(unsafe.hash));
                    }
                    
                    initData = params.join('&');
                }
            }
            
            if (initData && initData.length > 0) {
                authAttempted = true;
                
                // Submit authentication form with initData
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/auth/telegram';
                form.style.display = 'none';
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'initData';
                input.value = initData;
                form.appendChild(input);
                
                document.body.appendChild(form);
                form.submit();
            } else if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                // Fallback: use initDataUnsafe directly (less secure, but works)
                authAttempted = true;
                
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/auth/telegram_unsafe';
                form.style.display = 'none';
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'user_id';
                input.value = String(tg.initDataUnsafe.user.id);
                form.appendChild(input);
                
                document.body.appendChild(form);
                form.submit();
            } else {
                // No initData available yet - wait and retry (max 3 seconds)
                if (typeof authenticate.retryCount === 'undefined') {
                    authenticate.retryCount = 0;
                }
                authenticate.retryCount++;
                
                if (authenticate.retryCount < 6) { // 6 attempts = 3 seconds total
                    setTimeout(authenticate, 500);
                } else {
                    // After 3 seconds, redirect to login if still no initData
                    window.location.href = '/login';
                }
            }
        }
        
        // Try to authenticate immediately
        authenticate();
    })();
</script>
{{end}}
