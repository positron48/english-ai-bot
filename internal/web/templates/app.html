{{define "app.html"}}
{{template "base.html" .}}
{{end}}

{{define "app-content"}}
<div class="app-shell">
    <header>
        <h1>English Bot</h1>
        <nav>
            <a href="/app/dashboard">Dashboard</a>
            <a href="/app/vocab">Vocabulary</a>
            <a href="/app/training/start">Training</a>
        </nav>
    </header>
    <main id="main-content">
        <p id="status-message">Initializing...</p>
    </main>
</div>
<script>
    (function() {
        // Check if we're in Telegram WebApp
        if (!window.Telegram || !window.Telegram.WebApp) {
            // Not in Telegram, redirect to login after a short delay
            setTimeout(function() {
                window.location.href = '/login';
            }, 100);
            return;
        }
        
        const tg = window.Telegram.WebApp;
        
        // Initialize WebApp
        tg.ready();
        tg.expand();
        
        let authAttempted = false;
        let retryCount = 0;
        const maxRetries = 10; // 5 seconds total (10 * 500ms)
        
        function updateStatus(message) {
            const statusEl = document.getElementById('status-message');
            if (statusEl) {
                statusEl.textContent = message;
            }
        }
        
        // Function to authenticate
        function authenticate() {
            if (authAttempted) {
                return; // Prevent multiple attempts
            }
            
            retryCount++;
            updateStatus('Checking authentication... (attempt ' + retryCount + ')');
            
            // First, try to get initData string
            let initData = tg.initData;
            
            // If initData is available, use it
            if (initData && initData.length > 0) {
                updateStatus('Found initData, authenticating...');
                authAttempted = true;
                
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/auth/telegram';
                form.style.display = 'none';
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'initData';
                input.value = initData;
                form.appendChild(input);
                
                document.body.appendChild(form);
                form.submit();
                return;
            }
            
            // If initData is not available, try to construct it from initDataUnsafe
            if (tg.initDataUnsafe) {
                const unsafe = tg.initDataUnsafe;
                
                // Check if we have user and hash (required for validation)
                if (unsafe.user && unsafe.hash) {
                    updateStatus('Constructing initData from initDataUnsafe...');
                    
                    // Construct initData string from initDataUnsafe
                    const params = [];
                    
                    // Add query_id if available
                    if (unsafe.query_id) {
                        params.push('query_id=' + encodeURIComponent(unsafe.query_id));
                    }
                    
                    // Add user (required)
                    params.push('user=' + encodeURIComponent(JSON.stringify(unsafe.user)));
                    
                    // Add auth_date (required)
                    if (unsafe.auth_date) {
                        params.push('auth_date=' + encodeURIComponent(String(unsafe.auth_date)));
                    }
                    
                    // Add hash (required for validation)
                    params.push('hash=' + encodeURIComponent(unsafe.hash));
                    
                    initData = params.join('&');
                    
                    if (initData && initData.length > 0) {
                        updateStatus('Authenticating with constructed initData...');
                        authAttempted = true;
                        
                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = '/auth/telegram';
                        form.style.display = 'none';
                        
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'initData';
                        input.value = initData;
                        form.appendChild(input);
                        
                        document.body.appendChild(form);
                        form.submit();
                        return;
                    }
                }
                
                // Fallback: use initDataUnsafe.user.id directly if available
                if (unsafe.user && unsafe.user.id) {
                    updateStatus('Using fallback authentication (user ID: ' + unsafe.user.id + ')...');
                    authAttempted = true;
                    
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/auth/telegram_unsafe';
                    form.style.display = 'none';
                    
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'user_id';
                    input.value = String(unsafe.user.id);
                    form.appendChild(input);
                    
                    document.body.appendChild(form);
                    form.submit();
                    return;
                }
            }
            
            // No data available yet - wait and retry
            if (retryCount < maxRetries) {
                updateStatus('Waiting for Telegram data... (attempt ' + retryCount + '/' + maxRetries + ')');
                setTimeout(authenticate, 500);
            } else {
                // After max retries, redirect to login
                updateStatus('Telegram data not available, redirecting to login...');
                setTimeout(function() {
                    window.location.href = '/login';
                }, 1000);
            }
        }
        
        // Try to authenticate immediately
        authenticate();
    })();
</script>
{{end}}
