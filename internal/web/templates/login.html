{{template "base.html" .}}
{{define "content"}}
<div class="login-page">
    <h1>Login</h1>
    <form hx-post="/auth/request_otp" hx-target="#otp-section" hx-swap="innerHTML">
        <div>
            <label for="username">Telegram Username or ID:</label>
            <input type="text" id="username" name="username" required>
            <small>Enter your Telegram username (e.g., @positron48) or Telegram ID</small>
        </div>
        <button type="submit">Get OTP Code</button>
    </form>
    <div id="otp-section"></div>
</div>
{{end}}
