    <script>
      // Safe-area insets from the embedded Android app. Defined here (before the JS bundle) so a
      // native push that arrives during early page load is not lost. Some devices (e.g. Samsung)
      // don't expose env(safe-area-inset-*) to the WebView, so the layout falls back to these vars.
      (function () {
        var root = document.documentElement;
        window.__qantrixInsets = window.__qantrixInsets || {};
        window.__setSafeAreaInsets = function (top, bottom) {
          if (typeof top === 'number' && !isNaN(top)) {
            window.__qantrixInsets.top = Math.max(0, top);
            root.style.setProperty('--android-inset-top', Math.max(0, top) + 'px');
          }
          if (typeof bottom === 'number' && !isNaN(bottom)) {
            window.__qantrixInsets.bottom = Math.max(0, bottom);
            root.style.setProperty('--android-inset-bottom', Math.max(0, bottom) + 'px');
          }
        };
      })();
    </script>
    <script>
      // Suppress Telegram Web App console logs
      const originalLog = console.log;
      console.log = function(...args) {
        const message = args.join(' ');
        if (message.includes('[Telegram.WebView]') || message.includes('postEvent')) {
          return; // Suppress Telegram Web App logs
        }
        originalLog.apply(console, args);
      };
    </script>
