<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#F8F1E4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Linglow — Learn Languages with AI</title>
    <script>
      // Suppress Telegram Web App console logs
      const originalLog = console.log;
      console.log = function(...args) {
        const message = args.join(' ');
        if (message.includes('[Telegram.WebView]') || message.includes('postEvent')) {
          return; // Suppress Telegram Web App logs
        }
        originalLog.apply(console, args);
      };
    </script>
    <!-- Vendored: telegram.org is slow/blocked for some users (e.g. RU). Refresh from upstream when Telegram ships WebApp API updates. -->
    <script src="/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
